<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aeon · 日程 — 1999 电影级旧味</title>
<link rel="icon" href="/static/assets/decor/logo.svg">
<link rel="stylesheet" href="/static/styles/theme.css">
<style>
  /* ===== 日程页 ===== */
  .page-head{ display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:22px }
  .page-head .left{ flex:1; min-width:260px }
  .page-head h1{ font-family:var(--font-serif); font-size:clamp(30px,4vw,44px); font-weight:700; line-height:1.15; margin-top:8px }
  .page-head .sub{ color:var(--ink-soft); font-family:var(--font-serif); font-style:italic; margin-top:8px; font-size:15px }
  .date-block{ text-align:right; font-family:var(--font-mono) }
  .date-block .d{ font-size:26px; color:var(--amber-hi); letter-spacing:-.02em }
  .date-block .w{ font-size:11px; color:var(--ink-faint); letter-spacing:.2em; margin-top:2px }

  /* ===== 视图切换 ===== */
  .view-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin:20px 0 }
  .view-tabs .btn{ border-radius:99px }
  .view-tabs .btn.on{ background:var(--block); color:var(--block-ink); border-color:var(--block); box-shadow:0 0 12px var(--glow) }

  /* ===== 新增表单 ===== */
  .add-form{ display:flex; gap:10px; flex-wrap:wrap }
  .add-form input,.add-form select{
    background:var(--surface); border:var(--hairline); border-radius:var(--radius-s);
    color:var(--ink); padding:9px 12px; font-size:13.5px; font-family:inherit; outline:none;
  }
  .add-form input:focus,.add-form select:focus{ box-shadow:0 0 0 1px var(--amber), 0 0 12px var(--glow) }
  .add-form .nm{ flex:1; min-width:160px }
  .add-form .dt{ width:125px }
  .add-form .tm{ width:70px }
  .add-form .pr{ width:80px }
  .add-form .rp{ width:100px }

  /* ===== 时间线 ===== */
  .timeline{ position:relative; margin-top:24px; padding-left:26px }
  .timeline::before{ content:""; position:absolute; left:7px; top:4px; bottom:4px; border-left:2px dashed var(--line) }
  .tl-item{ position:relative; margin-bottom:14px }
  .tl-item::before{
    content:""; position:absolute; left:-26px; top:16px; width:12px; height:12px; border-radius:50%;
    background:var(--surface); border:2px solid var(--amber); box-shadow:0 0 8px var(--glow);
  }
  .tl-item.overdue::before{ border-color:var(--wine); box-shadow:0 0 8px var(--wine) }
  .tl-item.done::before{ background:var(--amber); border-color:var(--amber) }
  .event-card{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--surface); border:var(--hairline); border-radius:10px; padding:13px 16px;
    transition:.18s;
  }
  .event-card.overdue{ border-color:var(--wine); box-shadow:inset 3px 0 0 var(--wine) }
  .event-card.done{ opacity:.55 }
  .event-card.done .e-title{ text-decoration:line-through }
  .e-time{ font-family:var(--font-mono); font-size:13px; color:var(--amber-hi); min-width:52px }
  .e-title{ flex:1; font-size:14.5px }
  .e-pri{ width:8px; height:8px; border-radius:2px; flex:none }
  .pri-0{ background:var(--wine); box-shadow:0 0 6px var(--wine) }
  .pri-1{ background:var(--amber) }
  .pri-2{ background:var(--ink-faint) }
  .e-tag{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; color:var(--ink-faint);
    border:1px solid var(--line); border-radius:5px; padding:2px 7px; text-transform:uppercase }
  .e-tag.rpt{ color:var(--amber); border-color:var(--line) }
  .e-tag.ovd{ color:var(--wine); border-color:var(--wine); background:rgba(177,70,58,.08) }
  .e-actions{ display:flex; gap:6px }
  .e-actions .btn{ padding:6px 10px; font-size:12px }
  .e-actions .btn.done-btn.done{ background:var(--amber); color:var(--block-ink); border-color:var(--amber) }
  .empty-tip{ grid-column:1/-1; text-align:center; color:var(--ink-faint); padding:40px 0 }

  /* ===== 响应式 ===== */
  @media (max-width:880px){
    .date-block{ text-align:left }
    .e-time{ min-width:44px }
  }
</style>
<script src="/static/common/aeon-auth.js"></script>
<script>aeonRequireLogin();</script>
<script src="/static/common/aeon-modal.js"></script>
<script src="/static/common/aeon-data.js"></script>
<script src="/static/common/aeon-calendar.js"></script>
<script src="/static/common/aeon-subtitle.js"></script>
</head>
<body>

<!-- 胶片质感层 -->
<div class="fx fx-leak"></div>
<div class="fx fx-grain"></div>
<div class="fx fx-vignette"></div>
<div class="aeon-subtitle" id="aeonSubtitle"></div>

<div class="app">
  <aside class="side">
    <div class="brand" onclick="location.href='index.html'" style="cursor:pointer">
      <img src="/static/assets/decor/logo.svg" alt="Aeon">
      <div><b>Aeon</b><span>永恒 · 生活簿</span></div>
    </div>
    <nav class="nav">
      <a href="index.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l5 3"/></svg>今日</a>
      <a href="ledger.html"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18M8 3v4M16 3v4M8 13h3"/></svg>记账</a>
      <a href="habits.html"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/><circle cx="12" cy="12" r="9"/></svg>习惯</a>
      <a href="schedule.html" class="on"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M9 15l2 2 4-4"/></svg>日程</a>
      <a href="wishlist.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-8-5.5-8-11a4.5 4.5 0 018-2.6A4.5 4.5 0 0120 10c0 5.5-8 11-8 11z"/></svg>待买</a>
      <a href="media.html"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M9 8v8l6-4z"/></svg>书影音</a>
      <a href="briefing.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v18M5 7l7-4 7 4M5 17l7 4 7-4"/></svg>早报</a>
      <a href="files.html"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>文件</a>
      <a href="wiki.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l9 4-9 4-9-4z"/><path d="M3 11l9 4 9-4M3 15l9 4 9-4"/></svg>知识库</a>
      <a href="settings.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>设置</a>
    </nav>
    <div class="side-foot">
      <div class="moonbox">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M14 3a9 9 0 100 18c-4 0-7-3-7-7s3-7 7-7c0-2-1-3 0-4z" opacity=".85"/></svg>
        <span class="num">盈凸月 · 第 12 日</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="wrap">
      <div class="page-head">
        <div class="left">
          <div class="smallcaps">Schedule · 日程</div>
          <h1>日程统筹</h1>
          <div class="sub">逾期不藏，日日向前。</div>
        </div>
        <div class="date-block">
          <div class="d" id="todayD">—</div>
          <div class="w" id="todayW">—</div>
        </div>
      </div>

      <!-- 视图切换 -->
      <div class="view-tabs">
        <button class="btn on" data-v="today" onclick="setView('today',this)">今天</button>
        <button class="btn" data-v="week" onclick="setView('week',this)">本周</button>
        <button class="btn" data-v="undone" onclick="setView('undone',this)">未完成</button>
        <button class="btn" data-v="done" onclick="setView('done',this)">已完成</button>
        <button class="btn" data-v="all" onclick="setView('all',this)">全部</button>
      </div>

      <!-- 新增 -->
      <div class="card frame" style="padding:18px">
        <div class="add-form">
          <input class="nm" id="newTitle" placeholder="事件名称">
          <input class="dt" id="newDate" type="text" placeholder="点击选择日期" readonly>
          <input class="tm" id="newTime" type="time">
          <select class="pr" id="newPri">
            <option value="0">P0 重要</option>
            <option value="1" selected>P1 普通</option>
            <option value="2">P2 轻</option>
          </select>
          <select class="rp" id="newRepeat">
            <option value="">不重复</option>
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="monthly">每月</option>
          </select>
          <button class="btn btn-primary" onclick="addEvent()">＋ 添加</button>
        </div>
      </div>

      <!-- 时间线 -->
      <div class="timeline" id="timeline"></div>

    </div>
  </main>
</div>

<script>
const API = '';
let TOKEN = aeonGetToken();
let view = 'today';

async function init(){
  const now = new Date();
  document.getElementById('todayD').textContent = now.getDate() + ' 日';
  document.getElementById('todayW').textContent =
    ['SUN','MON','TUE','WED','THU','FRI','SAT'][now.getDay()];
  const dt = document.getElementById('newDate');
  dt.value = now.toISOString().slice(0,10);
  aeonCalendar.attach(dt);
  await load();
}
function hdr(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN }; }
async function api(path, method='GET', body=null){
  const opt = { method, headers: hdr() };
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(API + path, opt);
  if (r.status === 401){ aeonToLogin(); throw new Error('未登录'); }
  if (!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.detail || '请求失败'); }
  return r.json();
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function setView(v, btn){
  view = v;
  document.querySelectorAll('.view-tabs .btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  load();
}

async function load(){
  const cacheKey = 'schedule_view_' + view;
  const items = await aeonData.getCached(cacheKey, () => api('/api/schedule?view=' + view));
  renderTimeline(items);
  window.addEventListener('aeon:data', e => {
    if (e.detail.key === cacheKey) renderTimeline(e.detail.data);
  });
}
function renderTimeline(items){
  const tl = document.getElementById('timeline');
  if (!items.length){
    tl.innerHTML = '<div class="empty-tip">这一档还没有事件。</div>';
    return;
  }
  const priName = {0:'P0 · 重要，今天必须',1:'P1 · 普通，尽快安排',2:'P2 · 轻量，有空再做',3:'P3 · 可延后'};
  tl.innerHTML = items.map(e => `
    <div class="tl-item ${e.overdue ? 'overdue' : ''} ${e.done ? 'done' : ''}">
      <div class="event-card ${e.overdue ? 'overdue' : ''} ${e.done ? 'done' : ''}">
        <span class="e-time" data-tip="开始时间">${e.time || '—'}</span>
        <span class="e-pri pri-${e.priority}" data-tip="${priName[e.priority] || ''}"></span>
        <span class="e-title">${esc(e.title)}</span>
        ${e.overdue ? `<span class="e-tag ovd" data-tip="已逾期，自动顺延到今天">逾期 ${e.overdue_days} 天</span>` : ''}
        ${e.repeat ? `<span class="e-tag rpt" data-tip="重复：${esc(e.repeat)}">${esc(e.repeat)}</span>` : ''}
        <span class="e-tag" style="font-size:9px" data-tip="日期">${esc(e.date)}</span>
        <span class="e-actions">
          <button class="btn done-btn ${e.done ? 'done' : ''}" onclick="toggle(${e.id})">${e.done ? '✓' : '完成'}</button>
          <button class="btn btn-wine" onclick="del(${e.id})">✕</button>
        </span>
      </div>
    </div>`).join('');
}

async function addEvent(){
  const title = document.getElementById('newTitle').value.trim();
  if (!title) return;
  const date = document.getElementById('newDate').value;
  const time = document.getElementById('newTime').value;
  const priority = parseInt(document.getElementById('newPri').value);
  const repeat = document.getElementById('newRepeat').value;
  document.getElementById('newTitle').value = '';
  // 乐观更新：立即加事件
  const opt = { id: 'tmp-' + Date.now(), title, date, time, priority, repeat, done: false, overdue: false };
  // 插入当前视图
  try {
    const created = await api('/api/schedule', 'POST', { title, date, time, priority, repeat });
    await load();
  } catch(e) {
    await aeonAlert('添加失败：' + e.message);
  }
}
async function toggle(id){
  // 乐观更新：立即切换完成状态
  const all = await aeonData.readCache('schedule_view_' + view) || [];
  const item = all.find(x => x.id === id);
  if (item){ item.done = !item.done; aeonData.writeCache('schedule_view_' + view, all); renderTimeline(all); }
  try {
    await api(`/api/schedule/${id}/toggle`, 'POST');
    await load();
  } catch(e) {
    await aeonAlert('操作失败：' + e.message);
    await load();
  }
}
async function del(id){
  if (!(await aeonConfirm('删除这个事件？'))) return;
  // 乐观更新：立即移除
  const all = await aeonData.readCache('schedule_view_' + view) || [];
  const filtered = all.filter(x => x.id !== id);
  aeonData.writeCache('schedule_view_' + view, filtered);
  renderTimeline(filtered);
  try {
    await api(`/api/schedule/${id}`, 'DELETE');
    await load();
  } catch(e) {
    await aeonAlert('删除失败：' + e.message);
    await load();
  }
}

// 主题切换
const themeBtn = document.createElement('button');
themeBtn.className = 'btn';
themeBtn.style.cssText = 'position:fixed;bottom:18px;right:18px;z-index:95';
themeBtn.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18c-4 0-7-3-7-7s3-7 7-7c0-2-1-3 0-4z"/></svg>晨昏';
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const nxt = cur === 'dark' ? '' : 'dark';
  document.documentElement.setAttribute('data-theme', nxt);
  localStorage.setItem('aeon_theme', nxt || 'light');
};
document.body.appendChild(themeBtn);
const saved = localStorage.getItem('aeon_theme');
if (saved === 'light') document.documentElement.removeAttribute('data-theme');

init().catch(e => { document.getElementById('timeline').innerHTML = `<div class="empty-tip" style="color:var(--wine)">加载失败：${esc(e.message)}</div>`; });

// 页面字幕
aeonSubtitle.show('schedule');
</script>
</body>
</html>
