<style>
  .page-head{ display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:22px }
  .page-head .left{ flex:1; min-width:260px }
  .page-head h1{ font-family:var(--font-serif); font-size:clamp(30px,4vw,44px); font-weight:700; line-height:1.15; margin-top:8px }
  .page-head .sub{ color:var(--ink-soft); font-family:var(--font-serif); font-style:italic; margin-top:8px; font-size:15px }

  .breadcrumb{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px;
    font-family:var(--font-mono); font-size:12px; color:var(--ink-faint) }
  .breadcrumb a{ color:var(--amber); cursor:pointer; text-decoration:none }
  .breadcrumb a:hover{ text-decoration:underline }
  .breadcrumb .sep{ opacity:.5 }

  .file-list{ background:var(--surface); border:var(--hairline); border-radius:var(--radius);
    overflow:hidden }
  .f-row{ display:flex; align-items:center; gap:12px; padding:11px 16px; cursor:pointer;
    border-bottom:var(--line-soft); transition:.15s; font-size:13.5px }
  .f-row:last-child{ border-bottom:none }
  .f-row:hover{ background:var(--surface-2) }
  .f-row.dir:hover{ box-shadow:inset 3px 0 0 var(--amber) }
  .f-ic{ width:20px;height:20px; flex:none; color:var(--amber) }
  .f-row.file .f-ic{ color:var(--ink-faint) }
  .f-name{ flex:1; color:var(--ink) }
  .f-size{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint) }
  .f-empty{ text-align:center; color:var(--ink-faint); padding:40px 0 }

  .back-btn{ margin-bottom:14px }
  @media (max-width:880px){ .f-size{ display:none } }
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand" onclick="location.href='index.html'" style="cursor:pointer">
      <img src="/static/assets/decor/logo.svg" alt="Aeon">

    </div>

      <a href="briefing.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v18M5 7l7-4 7 4M5 17l7 4 7-4"/></svg>早报</a>

    </nav>
    <div class="side-foot">
      <div class="moonbox">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M14 3a9 9 0 100 18c-4 0-7-3-7-7s3-7 7-7c0-2-1-3 0-4z" opacity=".85"/></svg>
        <span class="num">盈凸月 · 第 12 日</span>
      </div>

  <main class="main">
    <div class="wrap">
      <div class="page-head">
        <div class="left">
          <div class="smallcaps">Files · 云端文件</div>
          <h1>文件浏览</h1>
          <div class="sub">服务器上的文件，都在这里。</div>
        </div>
        <button class="btn btn-primary" onclick="uploadFile()">＋ 上传文件</button>
      </div>

      <div class="breadcrumb" id="crumbs"></div>
      <div class="file-list" id="fileList"><div class="f-empty">加载中…</div></div>

    </div>
  </main>
</div>

<script>
const API = '';
let TOKEN = localStorage.getItem('aeon_token') || '';
let curPath = '';

function hdr(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN }; }
async function api(path, method='GET', body=null){
  const opt = { method, headers: hdr() };
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(API + path, opt);
  if (r.status === 401){ location.href='index.html'; throw new Error('未登录'); }
  if (!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.detail || '请求失败'); }
  return r.json();
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(n){
  if (n === null || n === undefined) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}

async function load(path){
  curPath = path || '';
  const d = await api('/api/files' + (curPath ? '?path=' + encodeURIComponent(curPath) : ''));
  renderCrumbs(d.path, d.parent);
  renderList(d);
}
function renderCrumbs(path, parent){
  const parts = path.split('/').filter(Boolean);
  let acc = '';
  const html = ['<a onclick="load(\'\')">/root</a>'];
  parts.forEach((p, i) => {
    acc += (acc ? '/' : '') + p;
    if (i === parts.length - 1){
      html.push(`<span class="sep">/</span><span>${esc(p)}</span>`);
    } else {
      html.push(`<span class="sep">/</span><a onclick="load('${esc(acc)}')">${esc(p)}</a>`);
    }
  });
  document.getElementById('crumbs').innerHTML = html.join('');
}
function renderList(d){
  const el = document.getElementById('fileList');
  if (!d.dirs.length && !d.files.length){
    el.innerHTML = '<div class="f-empty">空目录</div>';
    return;
  }
  const rows = [];
  if (d.parent !== null && d.parent !== undefined){
    rows.push(`<div class="f-row dir" onclick="load('${esc(d.parent || '')}')">
      <svg class="f-ic" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span class="f-name" style="color:var(--ink-faint)">.. 返回上级</span></div>`);
  }
  d.dirs.forEach(x => {
    rows.push(`<div class="f-row dir" onclick="load('${esc((curPath?curPath+'/':'')+x.name)}')">
      <svg class="f-ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
      <span class="f-name">${esc(x.name)}</span><span class="f-size">目录</span></div>`);
  });
  d.files.forEach(x => {
    const full = (curPath ? curPath + '/' : '') + x.name;
    rows.push(`<div class="f-row file" data-path="${esc(full)}">
      <svg class="f-ic" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>
      <span class="f-name">${esc(x.name)}</span><span class="f-size">${fmtSize(x.size)}</span>
      <span class="f-ops">
        <button class="btn" onclick="previewFile('${esc(full)}','${esc(x.name)}')">预览</button>
        <button class="btn" onclick="downloadFile('${esc(full)}')">下载</button>
      </span>
    </div>`);
  });
  el.innerHTML = rows.join('');
}

/* ── 文件操作：预览/下载/上传 ── */
async function previewFile(full, name){
  try {
    const r = await fetch('/api/files/preview?path=' + encodeURIComponent(full), { headers: hdr() });
    if (r.status === 401){ location.href='index.html'; return; }
    if (!r.ok){ const e = await r.json().catch(()=>({})); aeonAlert(e.detail || '无法预览'); return; }
    const ct = r.headers.get('content-type') || '';
    if (ct.startsWith('image/')){
      const url = '/api/files/preview?path=' + encodeURIComponent(full);
      aeonShowImage(name, url);
      return;
    }
    const d = await r.json();
    if (d.ext === '.md') aeonShowText(name, mdToHtml(d.content));
    else aeonShowText(name, esc(d.content));
  } catch(e) {
    aeonAlert('预览失败：' + e.message);
  }
}
async function downloadFile(full){
  const a = document.createElement('a');
  a.href = '/api/files/download?path=' + encodeURIComponent(full);
  a.download = full.split('/').pop();
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
function uploadFile(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.onchange = async () => {
    const f = inp.files[0];
    if (!f) return;
    const fd = new FormData();
    fd.append('file', f);
    fd.append('path', curPath);
    try {
      const r = await fetch('/api/files/upload', { method:'POST', headers:{ 'Authorization':'Bearer '+TOKEN }, body: fd });
      if (r.status === 401){ location.href='index.html'; return; }
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || '失败');
      aeonAlert(`已上传 ${d.name}`);
      load(curPath);
    } catch(e) { aeonAlert('上传失败：' + e.message); }
  };
  inp.click();
}
// 预览弹窗（文本）
function aeonShowText(name, html){
  const mask = document.createElement('div');
  mask.className = 'modal-mask open';
  mask.style.zIndex = '700';
  mask.innerHTML = `<div class="modal" style="max-width:680px;width:94vw;max-height:80vh;display:flex;flex-direction:column">
    <div class="m-title" style="flex:none">${esc(name)}</div>
    <div style="flex:1;overflow:auto;font-size:13px;line-height:1.8;color:var(--ink-soft);white-space:pre-wrap;word-break:break-all">${html}</div>
    <div class="m-actions" style="flex:none;margin-top:14px">
      <button class="btn btn-primary" onclick="this.closest('.modal-mask').remove()">关闭</button>
    </div>
  </div>`;
  document.body.appendChild(mask);
}
// 预览弹窗（图片）
function aeonShowImage(name, url){
  const mask = document.createElement('div');
  mask.className = 'modal-mask open';
  mask.style.zIndex = '700';
  mask.innerHTML = `<div class="modal" style="max-width:720px;width:94vw">
    <div class="m-title">${esc(name)}</div>
    <img src="${url}" style="max-width:100%;max-height:60vh;object-fit:contain;border-radius:8px" alt="${esc(name)}">
    <div class="m-actions" style="margin-top:14px">
      <button class="btn btn-primary" onclick="this.closest('.modal-mask').remove()">关闭</button>
    </div>
  </div>`;
  document.body.appendChild(mask);
}
// 简易 markdown 渲染（预览用）
function mdToHtml(md){
  let html = esc(md);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  html = html.replace(/^- (.*)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>)\n/g, '<ul>$1</ul>\n');
  return html;
}

// 主题切换
const themeBtn = document.createElement('button');
themeBtn.className = 'btn';
themeBtn.style.cssText = 'position:fixed;bottom:18px;right:18px;z-index:95';
themeBtn.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18c-4 0-7-3-7-7s3-7 7-7c0-2-1-3 0-4z"/></svg>晨昏';
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const nxt = cur === 'dark' ? '' : 'dark';
  document.documentElement.setAttribute('data-theme', nxt);
  localStorage.setItem('aeon_theme', nxt || 'light');
};
document.body.appendChild(themeBtn);
const saved = localStorage.getItem('aeon_theme');
if (saved === 'light') document.documentElement.removeAttribute('data-theme');

load().catch(e => {
  document.getElementById('fileList').innerHTML = `<div class="f-empty" style="color:var(--wine)">加载失败：${esc(e.message)}</div>`;
});
</script>
</body>
