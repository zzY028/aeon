<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aeon · 早报 — 1999 电影级旧味</title>
<link rel="icon" href="/static/assets/decor/logo.svg">
<link rel="stylesheet" href="/static/styles/theme.css">
<script src="/static/common/aeon-auth.js"></script>
<script>aeonRequireLogin();</script>
<script src="/static/common/aeon-modal.js"></script>
<script src="/static/common/aeon-subtitle.js"></script>
<style>
  /* ===== 早报页：Aeon 胶片风格 + 内容高对比显眼 ===== */
  .page-head{ display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:22px }
  .page-head .left{ flex:1; min-width:260px }
  .page-head h1{ font-family:var(--font-serif); font-size:clamp(30px,4vw,44px); font-weight:700; line-height:1.15; margin-top:8px }
  .page-head .sub{ color:var(--ink-soft); font-family:var(--font-serif); font-style:italic; margin-top:8px; font-size:15px }
  .date-block{ text-align:right; font-family:var(--font-mono) }
  .date-block .d{ font-size:26px; color:var(--amber-hi); letter-spacing:-.02em }
  .date-block .w{ font-size:11px; color:var(--ink-faint); letter-spacing:.2em; margin-top:2px }

  /* 引言 */
  .b-quote{ text-align:center; padding:34px 28px; margin-bottom:20px; position:relative }
  .b-quote .q{ font-family:var(--font-serif); font-size:20px; line-height:1.8; color:var(--ink);
    font-style:italic; }
  .b-quote .src{ display:block; margin-top:10px; font-family:var(--font-mono); font-size:12px;
    color:var(--amber-hi); letter-spacing:.14em }
  .b-quote::before,.b-quote::after{ content:""; position:absolute; width:34px; height:34px }
  .b-quote::before{ top:10px; left:12px; border-top:1px solid var(--amber); border-left:1px solid var(--amber) }
  .b-quote::after{ bottom:10px; right:12px; border-bottom:1px solid var(--amber); border-right:1px solid var(--amber) }

  /* 卡片：高对比 */
  .b-card{ position:relative; background:var(--surface); border:var(--hairline); border-radius:var(--radius);
    padding:20px 22px; margin-bottom:16px; box-shadow:inset 0 0 0 1px var(--line-soft) }
  .b-card .b-card-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px;
    padding-bottom:10px; border-bottom:var(--hairline) }
  .b-card .b-icon{ font-size:18px }
  .b-card .b-title{ font-family:var(--font-serif); font-size:17px; font-weight:700; color:var(--ink);
    letter-spacing:.02em }
  .b-card .b-tag{ margin-left:auto; font-family:var(--font-mono); font-size:10px; color:var(--ink-faint);
    letter-spacing:.18em; text-transform:uppercase }

  /* 天气 */
  .b-weather{ display:flex; align-items:center; gap:24px; flex-wrap:wrap }
  .b-temp{ font-family:var(--font-mono); font-size:42px; color:var(--amber-hi); letter-spacing:-.03em;
    text-shadow:0 0 18px var(--glow) }
  .b-temp small{ font-size:18px; color:var(--ink-soft) }
  .b-desc{ flex:1; min-width:160px; font-size:14px; color:var(--ink-soft); line-height:1.8 }
  .b-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; margin-top:14px }
  .b-w{ background:var(--surface-2); border:1px solid var(--line-soft); border-radius:var(--radius-s);
    padding:10px 8px; text-align:center }
  .b-w .label{ font-size:10px; color:var(--ink-faint); letter-spacing:.14em; text-transform:uppercase }
  .b-w .value{ font-size:14px; color:var(--ink); font-weight:600; margin-top:3px }

  /* 苏菲 */
  .b-sophie{ font-size:15px; color:var(--ink); line-height:2; white-space:pre-wrap;
    font-family:var(--font-serif); }
  .b-sophie-end{ margin-top:12px; text-align:right; font-family:var(--font-mono); font-size:12px;
    color:var(--amber-hi); letter-spacing:.1em }

  /* 新闻 */
  .b-cat{ font-size:12px; color:var(--amber-hi); font-weight:700; letter-spacing:.2em;
    margin:16px 0 8px; display:flex; align-items:center; gap:8px }
  .b-cat::after{ content:""; flex:1; height:1px; background:var(--line) }
  .b-news{ margin-bottom:12px; padding:12px 14px; background:var(--surface-2);
    border-left:2px solid var(--amber); border-radius:0 var(--radius-s) var(--radius-s) 0 }
  .b-news .n-title{ font-size:14.5px; font-weight:700; color:var(--ink); line-height:1.6 }
  .b-news .n-body{ font-size:13.5px; color:var(--ink-soft); margin-top:4px; line-height:1.7 }
  .b-news .n-src{ font-size:11px; color:var(--amber); margin-top:4px; font-family:var(--font-mono) }
  .b-news .n-src a{ color:var(--amber-hi); text-decoration:none }
  .b-news .n-src a:hover{ text-decoration:underline }
  .b-detail{ margin-top:6px; border:1px dashed var(--line); border-radius:6px; padding:6px 10px }
  .b-detail summary{ font-size:12px; color:var(--amber-hi); cursor:pointer; font-family:var(--font-serif); outline:none }
  .b-detail summary:hover{ text-decoration:underline }
  .b-detail-body{ font-size:12px; color:var(--ink-soft); margin-top:6px; line-height:1.7 }

  /* 文本卡（token/提醒） */
  .b-text{ font-size:14px; color:var(--ink); line-height:2 }
  .b-text .row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line-soft) }
  .b-text .row:last-child{ border-bottom:none }
  .b-text .k{ color:var(--ink-soft) }
  .b-text .v{ color:var(--ink); font-weight:700; font-family:var(--font-mono) }
  .b-text .total{ margin-top:10px; background:var(--surface-2); border-radius:var(--radius-s);
    padding:10px 14px; font-size:14px; color:var(--amber-hi); font-weight:700; font-family:var(--font-mono) }

  /* 收尾 */
  .b-footer{ text-align:center; font-size:12px; color:var(--ink-faint); margin-top:26px; line-height:2 }

  /* 加载/空态 */
  .b-loading{ text-align:center; color:var(--ink-faint); padding:60px 0 }
  .b-empty{ text-align:center; color:var(--wine); padding:60px 0 }

  @media (max-width:880px){
    .date-block{ text-align:left }
    .b-grid{ grid-template-columns:1fr }
    .b-temp{ font-size:34px }
  }
</style>
</head>
<body>

<div class="fx fx-leak"></div>
<div class="fx fx-grain"></div>
<div class="fx fx-vignette"></div>
<div class="aeon-subtitle" id="aeonSubtitle"></div>

<div class="app">
  <aside class="side">
    <div class="brand" onclick="location.href='index.html'" style="cursor:pointer">
      <img src="/static/assets/decor/logo.svg" alt="Aeon">
      <div><b>Aeon</b><span>永恒 · 生活簿</span></div>
    </div>
    <nav class="nav">
      <a href="index.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l5 3"/></svg>今日</a>
      <a href="ledger.html"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18M8 3v4M16 3v4M8 13h3"/></svg>记账</a>
      <a href="habits.html"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/><circle cx="12" cy="12" r="9"/></svg>习惯</a>
      <a href="schedule.html"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M9 15l2 2 4-4"/></svg>日程</a>
      <a href="wishlist.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-8-5.5-8-11a4.5 4.5 0 018-2.6A4.5 4.5 0 0120 10c0 5.5-8 11-8 11z"/></svg>待买</a>
      <a href="media.html"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M9 8v8l6-4z"/></svg>书影音</a>
      <a href="briefing.html" class="on"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v18M5 7l7-4 7 4M5 17l7 4 7-4"/></svg>早报</a>
      <a href="files.html"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>文件</a>
      <a href="wiki.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l9 4-9 4-9-4z"/><path d="M3 11l9 4 9-4M3 15l9 4 9-4"/></svg>知识库</a>
      <a href="settings.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>设置</a>
    </nav>
    <div class="side-foot">
      <div class="moonbox">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M14 3a9 9 0 100 18c-4 0-7-3-7-7s3-7 7-7c0-2-1-3 0-4z" opacity=".85"/></svg>
        <span class="num">盈凸月 · 第 12 日</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="wrap">
      <div class="page-head">
        <div class="left">
          <div class="smallcaps">Briefing · 早报</div>
          <h1>每日早报</h1>
          <div class="sub">清晨的第一杯信息，从胶片质感开始。</div>
        </div>
        <div class="date-block">
          <div class="d" id="todayD">—</div>
          <div class="w" id="todayW">—</div>
        </div>
      </div>

      <div id="briefContent">
        <div class="b-loading">早报加载中…</div>
      </div>

    </div>
  </main>
</div>

<script>
const API = '';
let TOKEN = aeonGetToken();

async function init(){
  const now = new Date();
  document.getElementById('todayD').textContent = now.getDate() + ' 日';
  document.getElementById('todayW').textContent = ['SUN','MON','TUE','WED','THU','FRI','SAT'][now.getDay()];
  await loadBriefing();
}
function hdr(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN }; }
async function api(path, method='GET', body=null){
  const opt = { method, headers: hdr() };
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(API + path, opt);
  if (r.status === 401){ aeonToLogin(); throw new Error('未登录'); }
  if (!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.detail || '请求失败'); }
  return r.json();
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderCard(c){
  switch(c.type){
    case 'weather':
      return `<div class="b-card">
        <div class="b-card-head"><span class="b-icon">${esc(c.icon||'🌤️')}</span>
          <span class="b-title">${esc(c.title)}</span><span class="b-tag">Weather</span></div>
        <div class="b-weather">
          <div class="b-temp">${esc(c.temp)}</div>
          <div class="b-desc">${esc(c.desc||'').replace(/<br>/g,'<br>')}</div>
        </div>
        ${c.grid && c.grid.length ? `<div class="b-grid">${c.grid.map(g =>
          `<div class="b-w"><div class="label">${esc(g.label)}</div><div class="value">${esc(g.value)}</div></div>`).join('')}</div>` : ''}
      </div>`;
    case 'sophie':
      return `<div class="b-card">
        <div class="b-card-head"><span class="b-icon">${esc(c.icon||'🐰')}</span>
          <span class="b-title">${esc(c.title)}</span><span class="b-tag">Sophie</span></div>
        <div class="b-sophie">${esc(c.text||'')}</div>
        ${c.end ? `<div class="b-sophie-end">${esc(c.end)}</div>` : ''}
      </div>`;
    case 'news':
      return `<div class="b-card">
        <div class="b-card-head"><span class="b-icon">${esc(c.icon||'📰')}</span>
          <span class="b-title">${esc(c.title)}</span><span class="b-tag">News</span></div>
        ${(c.categories||[]).map(cat => `
          <div class="b-cat">${esc(cat.name)}</div>
          ${(cat.items||[]).map(n => `
            <div class="b-news">
              <div class="n-title">${esc(n.title)}</div>
              ${n.body ? `<div class="n-body">${esc(n.body)}</div>` : ''}
              ${n.explain ? `<details class="b-detail"><summary>${esc(n.explain.label)}</summary><div class="b-detail-body">${esc(n.explain.body)}</div></details>` : ''}
              ${n.src ? `<div class="n-src">${esc(n.src)}</div>` : ''}
            </div>`).join('')}`).join('')}
      </div>`;
    default:
      // text 卡：token 行 / 提醒行
      const body = c.body || [];
      const html = body.map(t => {
        if (t.includes('：') && t.length < 60){
          const idx = t.indexOf('：');
          return `<div class="row"><span class="k">${esc(t.slice(0,idx))}</span><span class="v">${esc(t.slice(idx+1))}</span></div>`;
        }
        return `<div>${esc(t)}</div>`;
      }).join('');
      return `<div class="b-card">
        <div class="b-card-head"><span class="b-icon">${esc(c.icon||'📌')}</span>
          <span class="b-title">${esc(c.title)}</span><span class="b-tag">Note</span></div>
        <div class="b-text">${html}</div>
      </div>`;
  }
}

async function loadBriefing(){
  try {
    const d = await api('/api/briefing');
    const el = document.getElementById('briefContent');
    let html = '';
    if (d.quote){
      html += `<div class="b-quote frame"><div class="q">${esc(d.quote)}</div>
        ${d.quote_src ? `<span class="src">${esc(d.quote_src)}</span>` : ''}</div>`;
    }
    html += (d.cards || []).map(renderCard).join('');
    if (d.footer){
      html += `<div class="b-footer">${esc(d.footer).replace(/\n/g,'<br>')}</div>`;
    }
    el.innerHTML = html || '<div class="b-empty">暂无早报内容</div>';
  } catch(e) {
    document.getElementById('briefContent').innerHTML =
      `<div class="b-empty">${esc(e.message)}</div>`;
  }
}

// 主题切换
const themeBtn = document.createElement('button');
themeBtn.className = 'btn';
themeBtn.style.cssText = 'position:fixed;bottom:18px;right:18px;z-index:95';
themeBtn.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18c-4 0-7-3-7-7s3-7 7-7c0-2-1-3 0-4z"/></svg>晨昏';
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const nxt = cur === 'dark' ? '' : 'dark';
  document.documentElement.setAttribute('data-theme', nxt);
  localStorage.setItem('aeon_theme', nxt || 'light');
};
document.body.appendChild(themeBtn);
const saved = localStorage.getItem('aeon_theme');
if (saved === 'light') document.documentElement.removeAttribute('data-theme');

init().catch(() => {});

// 页面字幕
aeonSubtitle.show('briefing');
</script>
</body>
</html>
