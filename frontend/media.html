<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aeon · 书影音 — 1999 电影级旧味</title>
<link rel="icon" href="/static/assets/decor/logo.svg">
<link rel="stylesheet" href="/static/styles/theme.css">
<style>
  .page-head{ display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:22px }
  .page-head .left{ flex:1; min-width:260px }
  .page-head h1{ font-family:var(--font-serif); font-size:clamp(30px,4vw,44px); font-weight:700; line-height:1.15; margin-top:8px }
  .page-head .sub{ color:var(--ink-soft); font-family:var(--font-serif); font-style:italic; margin-top:8px; font-size:15px }
  .date-block{ text-align:right; font-family:var(--font-mono) }
  .date-block .d{ font-size:26px; color:var(--amber-hi); letter-spacing:-.02em }
  .date-block .w{ font-size:11px; color:var(--ink-faint); letter-spacing:.2em; margin-top:2px }

  .view-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin:20px 0 }
  .view-tabs .btn{ border-radius:99px }
  .view-tabs .btn.on{ background:var(--block); color:var(--block-ink); border-color:var(--block); box-shadow:0 0 12px var(--glow) }

  .add-form{ display:flex; gap:10px; flex-wrap:wrap }
  .add-form input,.add-form select,.add-form textarea{
    background:var(--surface); border:var(--hairline); border-radius:var(--radius-s);
    color:var(--ink); padding:9px 12px; font-size:13.5px; font-family:inherit; outline:none;
  }
  .add-form .nm{ flex:1; min-width:150px }
  .add-form .tp{ width:90px }
  .add-form .st{ width:100px }
  .add-form .rt{ width:80px }

  .media-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px; margin-top:22px }
  .m-card{ position:relative; display:flex; gap:16px; align-items:flex-start; padding-top:26px }
  .m-cover{ width:64px; height:88px; border-radius:8px; flex:none; position:relative;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:linear-gradient(135deg, var(--amber-deep), var(--amber));
    font-family:var(--font-serif); font-size:24px; color:var(--block-ink); font-weight:700;
    box-shadow:2px 3px 10px var(--shadow); }
  .m-cover::after{ content:""; position:absolute; inset:4px; border:1px dashed rgba(0,0,0,.18); border-radius:6px }
  .m-body{ flex:1; min-width:0 }
  .m-title{ font-family:var(--font-serif); font-size:17px; font-weight:700; margin-bottom:4px }
  .m-meta{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px }
  .m-type{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--amber); border:1px solid var(--line); border-radius:5px; padding:2px 7px }
  .m-st{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; border-radius:5px; padding:2px 7px }
  .st-want{ color:var(--ink-faint); border:1px solid var(--line) }
  .st-doing{ color:var(--amber); border:1px solid var(--amber) }
  .st-done{ color:var(--block-ink); background:var(--amber); border-color:var(--amber) }
  .m-stars{ color:var(--amber-hi); letter-spacing:2px; font-size:13px }
  .m-comment{ font-size:12px; color:var(--ink-soft); line-height:1.6 }
  .m-actions{ display:flex; gap:6px; margin-top:10px }
  .m-actions .btn{ padding:5px 9px; font-size:11.5px }
  .m-actions .btn.read{ background:var(--amber); color:var(--block-ink); border-color:var(--amber) }
  .empty-tip{ text-align:center; color:var(--ink-faint); padding:40px 0; grid-column:1/-1 }

  .stats-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-top:22px }
  .stat-card{ text-align:center; padding:16px }
  .stat-card .v{ font-family:var(--font-mono); font-size:28px; color:var(--amber-hi) }
  .stat-card .k{ font-size:11px; color:var(--ink-faint); letter-spacing:.18em; text-transform:uppercase; margin-top:4px }

  @media (max-width:880px){
    .date-block{ text-align:left }
    .m-card{ flex-direction:row }
  }
</style>
<script src="/static/common/aeon-modal.js"></script>
<script src="/static/common/aeon-data.js"></script>
<script src="/static/common/aeon-subtitle.js"></script>
</head>
<body>

<div class="fx fx-leak"></div>
<div class="fx fx-grain"></div>
<div class="fx fx-vignette"></div>
<div class="aeon-subtitle" id="aeonSubtitle"></div>

<div class="app">
  <aside class="side">
    <div class="brand" onclick="location.href='index.html'" style="cursor:pointer">
      <img src="/static/assets/decor/logo.svg" alt="Aeon">
      <div><b>Aeon</b><span>永恒 · 生活簿</span></div>
    </div>
    <nav class="nav">
      <a href="index.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l5 3"/></svg>今日</a>
      <a href="ledger.html"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18M8 3v4M16 3v4M8 13h3"/></svg>记账</a>
      <a href="habits.html"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/><circle cx="12" cy="12" r="9"/></svg>习惯</a>
      <a href="schedule.html"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M9 15l2 2 4-4"/></svg>日程</a>
      <a href="wishlist.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-8-5.5-8-11a4.5 4.5 0 018-2.6A4.5 4.5 0 0120 10c0 5.5-8 11-8 11z"/></svg>待买</a>
      <a href="media.html" class="on"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M9 8v8l6-4z"/></svg>书影音</a>
      <a href="briefing.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v18M5 7l7-4 7 4M5 17l7 4 7-4"/></svg>早报</a><a href="files.html"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>文件</a><a href="wiki.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l9 4-9 4-9-4z"/><path d="M3 11l9 4 9-4M3 15l9 4 9-4"/></svg>知识库</a>
      <a href="wiki.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l9 4-9 4-9-4z"/><path d="M3 11l9 4 9-4M3 15l9 4 9-4"/></svg>知识库</a>

      <a href="files.html"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>文件</a>

      <a href="settings.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>设置</a>
    </nav>
    <div class="side-foot">
      <div class="moonbox">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M14 3a9 9 0 100 18c-4 0-7-3-7-7s3-7 7-7c0-2-1-3 0-4z" opacity=".85"/></svg>
        <span class="num">盈凸月 · 第 12 日</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="wrap">
      <div class="page-head">
        <div class="left">
          <div class="smallcaps">Media · 书影音</div>
          <h1>书影音收藏</h1>
          <div class="sub">读过的书，看过的片，都是时间留下来的刻度。</div>
        </div>
        <div class="date-block">
          <div class="d" id="todayD">—</div>
          <div class="w" id="todayW">—</div>
        </div>
      </div>

      <div class="view-tabs">
        <button class="btn on" data-t="" onclick="setType('',this)">全部</button>
        <button class="btn" data-t="book" onclick="setType('book',this)">书</button>
        <button class="btn" data-t="movie" onclick="setType('movie',this)">电影</button>
        <button class="btn" data-t="series" onclick="setType('series',this)">剧集</button>
        <button class="btn" data-t="music" onclick="setType('music',this)">音乐</button>
        <button class="btn" onclick="location.href='reader.html'">📚 书架</button>
      </div>

      <div class="card frame" style="padding:18px">
        <div class="add-form">
          <input class="nm" id="newTitle" placeholder="书名 / 电影 / 剧集">
          <select class="tp" id="newType"><option value="book">书</option><option value="movie">电影</option><option value="series">剧集</option><option value="music">音乐</option></select>
          <select class="st" id="newStatus"><option value="want">想看</option><option value="doing">进行中</option><option value="done">已完成</option></select>
          <select class="rt" id="newRating"><option value="0">无评分</option><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select>
          <button class="btn btn-primary" onclick="addMedia()">＋ 添加</button>
        </div>
      </div>

      <div class="stats-row">
        <div class="card frame stat-card"><div class="v" id="statTotal">0</div><div class="k">全部</div></div>
        <div class="card frame stat-card"><div class="v" id="statRating">0</div><div class="k">平均评分</div></div>
        <div class="card frame stat-card"><div class="v" id="statDoing">0</div><div class="k">进行中</div></div>
        <div class="card frame stat-card"><div class="v" id="statDone">0</div><div class="k">已完成</div></div>
      </div>

      <div class="media-grid" id="mediaGrid"></div>

    </div>
  </main>
</div>

<script>
const API = '';
let TOKEN = localStorage.getItem('aeon_token') || '';
let filter = '';

async function init(){
  const now = new Date();
  document.getElementById('todayD').textContent = now.getDate() + ' 日';
  document.getElementById('todayW').textContent = ['SUN','MON','TUE','WED','THU','FRI','SAT'][now.getDay()];
  await load();
  await loadStats();
}
function hdr(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN }; }
async function api(path, method='GET', body=null){
  const opt = { method, headers: hdr() };
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(API + path, opt);
  if (r.status === 401){ location.href='index.html'; throw new Error('未登录'); }
  if (!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.detail || '请求失败'); }
  return r.json();
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function setType(t, btn){
  filter = t;
  document.querySelectorAll('.view-tabs .btn[data-t]').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  load();
}

async function load(){
  const cacheKey = 'media_all' + (filter ? '_' + filter : '');
  const items = await aeonData.getCached(cacheKey, () => api('/api/media' + (filter ? '?mtype=' + filter : '')));
  renderMedia(items);
  window.addEventListener('aeon:data', e => {
    if (e.detail.key === cacheKey) renderMedia(e.detail.data);
  });
}
function renderMedia(items){
  const grid = document.getElementById('mediaGrid');
  if (!items.length){
    grid.innerHTML = '<div class="empty-tip">还没有收藏。读过的好书、看过的电影，记下来吧。</div>';
    return;
  }
  const typeName = { book:'书', movie:'电影', series:'剧集', music:'音乐' };
  const stName = { want:'想看', doing:'进行中', done:'已完成' };
  grid.innerHTML = items.map(m => `
    <div class="card frame m-card" data-id="${m.id}">
      <div class="m-cover">${esc(m.title[0] || '?')}</div>
      <div class="m-body">
        <div class="m-title">${esc(m.title)}</div>
        <div class="m-meta">
          <span class="m-type">${typeName[m.mtype] || m.mtype}</span>
          <span class="m-st st-${m.status}">${stName[m.status] || m.status}</span>
          ${m.rating > 0 ? `<span class="m-stars">${'★'.repeat(m.rating)}</span>` : ''}
        </div>
        ${m.comment ? `<div class="m-comment">${esc(m.comment)}</div>` : ''}
        <div class="m-actions">
          ${m.mtype === 'book' ? `<button class="btn read" onclick="location.href='reader.html'">去书架</button>` : ''}
          <button class="btn" onclick="setStatus(${m.id},'doing')">在看</button>
          <button class="btn" onclick="setStatus(${m.id},'done')">看完</button>
          <button class="btn btn-wine" onclick="del(${m.id})">✕</button>
        </div>
      </div>
    </div>`).join('');
}

async function loadStats(){
  const s = await api('/api/media/stats');
  document.getElementById('statTotal').textContent = s.total;
  document.getElementById('statRating').textContent = s.avg_rating || '—';
  document.getElementById('statDoing').textContent = s.status_dist.doing || 0;
  document.getElementById('statDone').textContent = s.status_dist.done || 0;
}

async function addMedia(){
  const title = document.getElementById('newTitle').value.trim();
  if (!title) return;
  const mtype = document.getElementById('newType').value;
  const status = document.getElementById('newStatus').value;
  const rating = parseInt(document.getElementById('newRating').value);
  document.getElementById('newTitle').value = '';
  // 乐观更新：立即加卡片
  const opt = { id: 'tmp-' + Date.now(), title, mtype, status, rating, comment: '' };
  const all = await aeonData.readCache('media_all') || [];
  aeonData.writeCache('media_all', [...all, opt]);
  renderMedia([...all, opt]);
  // 后台同步
  try {
    await api('/api/media', 'POST', { title, mtype, status, rating });
    await load(); await loadStats();
  } catch(e) {
    await aeonAlert('添加失败：' + e.message);
    await load(); await loadStats();
  }
}
async function setStatus(id, status){
  // 乐观更新：立即切换状态
  const all = await aeonData.readCache('media_all') || [];
  const item = all.find(m => m.id === id);
  if (item){ item.status = status; aeonData.writeCache('media_all', all); renderMedia(all); }
  // 后台同步
  try {
    await api(`/api/media/${id}`, 'PUT', { status });
    await load(); await loadStats();
  } catch(e) {
    if (item){ item.status = item.status === 'doing' ? 'want' : item.status; aeonData.writeCache('media_all', all); renderMedia(all); }
    await aeonAlert('操作失败：' + e.message);
    await load(); await loadStats();
  }
}
async function del(id){
  if (!(await aeonConfirm('删除这个收藏？'))) return;
  // 乐观更新：立即移除
  const all = await aeonData.readCache('media_all') || [];
  const filtered = all.filter(m => m.id !== id);
  aeonData.writeCache('media_all', filtered);
  renderMedia(filtered);
  // 后台同步
  try {
    await api(`/api/media/${id}`, 'DELETE');
    await load(); await loadStats();
  } catch(e) {
    await aeonAlert('删除失败：' + e.message);
    await load(); await loadStats();
  }
}

// 主题切换
const themeBtn = document.createElement('button');
themeBtn.className = 'btn';
themeBtn.style.cssText = 'position:fixed;bottom:18px;right:18px;z-index:95';
themeBtn.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18c-4 0-7-3-7-7s3-7 7-7c0-2-1-3 0-4z"/></svg>晨昏';
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const nxt = cur === 'dark' ? '' : 'dark';
  document.documentElement.setAttribute('data-theme', nxt);
  localStorage.setItem('aeon_theme', nxt || 'light');
};
document.body.appendChild(themeBtn);
const saved = localStorage.getItem('aeon_theme');
if (saved === 'light') document.documentElement.removeAttribute('data-theme');

init().catch(e => { document.getElementById('mediaGrid').innerHTML = `<div class="empty-tip" style="color:var(--wine)">加载失败：${esc(e.message)}</div>`; });

// 页面字幕
aeonSubtitle.show('media');
</script>
</body>
</html>
