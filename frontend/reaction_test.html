<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>反应速度测试 · Reaction Test</title>
<link rel="stylesheet" href="/static/styles/theme.css">
<script src="/static/common/aeon-shell.js"></script>
<style>
  /* 配色全部改为沿用 Aeon 全局 token，本页只补充「状态色」三项。
     原先这里自带一整套深蓝黑 :root，是浅色主题下整页发暗的根源。 */
  :root{
    --ok:#4d7a2c;      --ok-bg:#e6efd8;      /* 变绿：可以点了 */
    --bad:#8c2b25;     --bad-bg:#f4e1de;     /* 太早（用了主题酒红） */
    --cool:#4a6a94;
  }
  [data-theme="dark"]{
    --ok:#7fb069;      --ok-bg:#1c3a24;
    --bad:#c96f5e;     --bad-bg:#3a1c1c;
    --cool:#7a9bc4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 背景沿用全局 body 的胶片渐层，不另起炉灶 */
  body {
    color: var(--ink);
    font-family: var(--font-sans);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .header {
    padding: 16px 20px; border-bottom: var(--hairline);
    display: flex; align-items: center; justify-content: space-between; gap:12px; flex-wrap:wrap;
  }
  .header h1 { font-size: 17px; color: var(--amber-hi); font-family:var(--font-serif) }
  .header .stats { font-size: 13px; color: var(--ink-soft); display: flex; gap: 18px; }
  .header .stats b { color: var(--amber); }
  .stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; transition: background .12s;
    position: relative;
  }
  .stage .msg { text-align: center; padding: 0 30px; }
  .stage .msg h2 { font-size: 30px; font-weight: 600; margin-bottom: 12px; font-family:var(--font-serif) }
  .stage .msg p { font-size: 15px; color: var(--ink-soft); }
  .stage .result {
    position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
    text-align: center; width: 100%; padding: 0 20px;
  }
  .stage .result .big { font-size: 56px; font-weight: 700; color: var(--amber-hi); font-variant-numeric: tabular-nums;
    font-family:var(--font-mono); letter-spacing:-.03em }
  .stage .result .label { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .stage .result .rank { font-size: 14px; margin-top: 10px; color: var(--amber); }
  /* 状态底色：全部走 token，两套主题各自取值，不再写死深蓝黑 */
  .stage.idle,.stage.wait,.stage.result-mode { background: transparent; }
  .stage.go { background: var(--ok-bg); }
  .stage.too-early { background: var(--bad-bg); }
  .stage.go .msg h2 { color: var(--ok) }
  .stage.too-early .msg h2 { color: var(--bad) }
  .footer {
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top: var(--hairline); text-align: center;
    font-size: 12px; color: var(--ink-faint);
  }
  .restart-btn {
    background: var(--surface); border: 1px solid var(--amber); color: var(--amber);
    border-radius: var(--radius-s); padding: 10px 20px; min-height:44px; font:inherit; font-size: 14px;
    cursor: pointer; margin-top: 18px; transition: .15s;
  }
  .restart-btn:hover { background: var(--amber); color: var(--block-ink); box-shadow:0 0 16px var(--glow) }
  @media (max-width:600px){
    .header{ padding:12px 14px; gap:8px }
    .header h1{ font-size:16px }
    .header .stats{ font-size:12px; gap:12px }
    .stage .msg h2{ font-size:26px }
    .stage .result .big{ font-size:46px }
    .footer{ font-size:11.5px }
  }
  /* 悬浮的主题入口钉在右下角。窄屏时底部这行提示会正好从它下面穿过
     （实测 320/360/390 三档都压字），这里把提示抬到按钮上方留出通道。
     宽屏提示是居中的短句，够不到最右侧，不需要这条。 */
  @media (max-width:640px){
    .footer{ padding-bottom: calc(64px + env(safe-area-inset-bottom)) }
  }
</style>
<script src="/static/common/aeon-auth.js"></script>
<script>aeonRequireLogin();</script>
</head>
<body>

<!-- 胶片质感层：与其他页面保持一致的整体基调 -->
<div class="fx fx-leak"></div>
<div class="fx fx-grain"></div>
<div class="fx fx-vignette"></div>

<div class="header">
  <h1>⚡ 反应速度测试</h1>
  <div class="stats">
    <span>第 <b id="round">1</b>/5 轮</span>
    <span>最好 <b id="best">—</b></span>
    <span>平均 <b id="avg">—</b></span>
  </div>
</div>

<div class="stage" id="stage">
  <div class="msg" id="msg">
    <h2 id="title">点击开始</h2>
    <p id="hint">屏幕变绿后立刻点击，测你的反应速度</p>
  </div>
  <div class="result" id="result" style="display:none">
    <div class="big" id="bigNum">0</div>
    <div class="label" id="resultLabel">毫秒</div>
    <div class="rank" id="rank"></div>
    <button class="restart-btn" id="restartBtn">再来一次</button>
  </div>
</div>

<div class="footer">变绿后点击 · 5 轮取平均 · 人类平均约 250ms · 职业选手 150-180ms</div>

<script>
const stage = document.getElementById('stage');
const msg = document.getElementById('msg');
const title = document.getElementById('title');
const hint = document.getElementById('hint');
const result = document.getElementById('result');
const bigNum = document.getElementById('bigNum');
const resultLabel = document.getElementById('resultLabel');
const rankEl = document.getElementById('rank');
const roundEl = document.getElementById('round');
const bestEl = document.getElementById('best');
const avgEl = document.getElementById('avg');
const restartBtn = document.getElementById('restartBtn');

let state = 'idle';       // idle | waiting | ready | tooEarly | done
let timer = null;
let startTime = 0;
let rounds = [];
const MAX_ROUNDS = 5;

function setState(s) {
  state = s;
  stage.className = 'stage ' + s;
}

function resetRoundUI() {
  result.style.display = 'none';
  msg.style.display = 'block';
}

function handleClick() {
  if (state === 'idle') {
    startWaiting();
  } else if (state === 'waiting') {
    // 变绿前就点了 → 太早
    clearTimeout(timer);
    setState('too-early');
    title.textContent = '太早了！';
    hint.textContent = '等它变绿再点，重新开始这一轮';
    rounds = [];
    updateHeader();
    setTimeout(() => { msg.style.display = 'block'; startWaiting(); }, 800);
  } else if (state === 'ready') {
    // 变绿后点击 → 记录成绩
    const t = performance.now() - startTime;
    rounds.push(t);
    showResult(t);
  } else if (state === 'too-early') {
    // 忽略，等自动重启
  }
}

function startWaiting() {
  resetRoundUI();
  setState('waiting');
  title.textContent = '等待中…';
  hint.textContent = '屏幕变绿后立刻点击';
  // 随机延迟 1.5~4 秒
  const delay = 1500 + Math.random() * 2500;
  timer = setTimeout(() => {
    setState('go');
    title.textContent = '点击！';
    hint.textContent = '现在！';
    startTime = performance.now();
  }, delay);
}

function showResult(t) {
  const ms = Math.round(t);
  setState('result-mode');
  msg.style.display = 'none';
  result.style.display = 'block';
  bigNum.textContent = ms;
  resultLabel.textContent = '毫秒';
  rankEl.textContent = rank(ms);

  if (rounds.length >= MAX_ROUNDS) {
    // 全部完成
    const avg = Math.round(rounds.reduce((a,b)=>a+b,0) / rounds.length);
    title.textContent = '完成！';
    hint.textContent = '';
    avgEl.textContent = avg + 'ms';
    restartBtn.style.display = 'inline-block';
  } else {
    // 下一轮
    restartBtn.style.display = 'none';
    roundEl.textContent = rounds.length + 1;
    setTimeout(() => startWaiting(), 1200);
  }
  updateHeader();
}

function rank(ms) {
  if (ms < 150) return '🏆 机器人级别！';
  if (ms < 180) return '⚡ 职业选手级';
  if (ms < 220) return '🔥 非常快';
  if (ms < 280) return '👍 优于平均';
  if (ms < 350) return '😐 正常水平';
  return '🐢 有点慢，多练练';
}

function updateHeader() {
  if (rounds.length) {
    bestEl.textContent = Math.min(...rounds) + 'ms';
    avgEl.textContent = Math.round(rounds.reduce((a,b)=>a+b,0)/rounds.length) + 'ms';
  }
}

restartBtn.addEventListener('click', () => {
  rounds = [];
  roundEl.textContent = 1;
  bestEl.textContent = '—';
  avgEl.textContent = '—';
  result.style.display = 'none';
  msg.style.display = 'block';
  startWaiting();
});

stage.addEventListener('click', handleClick);
</script>
</body>
</html>
