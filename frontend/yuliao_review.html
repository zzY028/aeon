<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>语料审查台 · 嘴硬心软筛选器</title>
<style>
  :root {
    --bg: #16161d;
    --surface: #1e1e28;
    --card: #242433;
    --ink: #e8e6e0;
    --ink-soft: #a8a6b0;
    --amber: #c4a86c;
    --amber-hi: #d9bc7e;
    --green: #7fb069;
    --red: #c96f5e;
    --line: #34344a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(22,22,29,.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 16px;
  }
  .header h1 { font-size: 18px; font-weight: 600; letter-spacing: .5px; }
  .header .stat { font-size: 13px; color: var(--ink-soft); }
  .header .stat b { color: var(--amber-hi); }
  .header .actions { margin-left: auto; display: flex; gap: 10px; }
  .btn {
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; font-size: 13px; cursor: pointer;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--amber); color: var(--amber-hi); }
  .btn.primary {
    background: var(--amber); color: #1a1a1a; border: none; font-weight: 600;
  }
  .btn.primary:hover { background: var(--amber-hi); color: #1a1a1a; }
  .cats { display: flex; gap: 8px; padding: 14px 20px 4px; flex-wrap: wrap; }
  .cat-chip {
    padding: 6px 12px; border-radius: 20px; font-size: 12px;
    background: var(--card); border: 1px solid var(--line); color: var(--ink-soft);
    cursor: pointer; transition: all .15s;
  }
  .cat-chip.on { background: var(--amber); color: #1a1a1a; border-color: var(--amber); }
  .list { padding: 14px 20px 40px; max-width: 760px; margin: 0 auto; }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-bottom: 12px; transition: all .2s;
  }
  .item.chosen { border-color: var(--green); background: rgba(127,176,105,.08); }
  .item.rejected { border-color: var(--red); background: rgba(201,111,94,.06); opacity: .75; }
  .item .meta { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .item .src {
    font-size: 11px; color: var(--amber-hi);
    background: rgba(196,168,108,.12); padding: 2px 8px; border-radius: 4px;
  }
  .item .text { font-size: 14px; line-height: 1.8; color: var(--ink); white-space: pre-wrap; }
  .item .text .role { color: var(--amber); font-weight: 600; }
  .item .btns { display: flex; gap: 8px; margin-top: 12px; }
  .item .btns .btn { flex: 1; padding: 7px; font-size: 12px; }
  .btn.yes { border-color: var(--green); color: var(--green); }
  .btn.yes:hover { background: var(--green); color: #1a1a1a; }
  .btn.no { border-color: var(--red); color: var(--red); }
  .btn.no:hover { background: var(--red); color: #1a1a1a; }
  .btn.undo { border-color: var(--line); color: var(--ink-soft); }
  .footer { padding: 20px; text-align: center; color: var(--ink-soft); font-size: 12px; }
  .empty { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--amber); color: #1a1a1a; padding: 10px 20px; border-radius: 8px;
    font-size: 13px; font-weight: 600; opacity: 0; transition: all .3s; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 600px) {
    .header { padding: 12px 14px; }
    .header h1 { font-size: 15px; }
    .list { padding: 12px 14px 40px; }
    .item { padding: 13px; }
  }
</style>
<script src="/static/common/aeon-auth.js"></script>
<script>aeonRequireLogin();</script>
</head>
<body>

<div class="header">
  <h1>语料审查台</h1>
  <div class="stat">已选 <b id="chosenCount">0</b> / <span id="totalCount">0</span> · 已弃 <b id="rejectedCount" style="color:var(--red)">0</b></div>
  <div class="actions">
    <button class="btn" onclick="exportJSON()">导出选中</button>
    <button class="btn" onclick="resetAll()">清空</button>
  </div>
</div>

<div class="cats" id="cats"></div>
<div class="list" id="list"></div>
<div class="footer">选「要」的留下 → 导出 JSON → 就是训练语料</div>
<div class="toast" id="toast"></div>

<script>
// 语料数据（由后端脚本生成注入）
const DATA = {"categories": [{"id": "wulin", "name": "武林外传（古装损友）", "items": [{"id": "w0", "text": "[白展堂] 还知道吃！\n[李大嘴] 我不了你两天工钱了，等我伤好了，我立马走人。"}, {"id": "w1", "text": "[小米] 那是他抢我的钱，再说我骗谁也不敢骗你啊！我就是抢劫，我也不能选个大白天的，对不对？\n[邢育森] 哎，你还真跑，六儿！"}, {"id": "w2", "text": "[白展堂] 你给我站住，越来越不听话了呢，再不听话我就点你死穴啊！我可真点了啊！\n[祝无双] 你要寻死是吧，我陪你，来来来，走走走，我陪你去，干啥呀……"}, {"id": "w3", "text": "[祝小芸] 这怎么行啊？这把剑是师父亲手赠予你的。\n[周敦儒] 而且还跟了你这么多年呐。走。"}, {"id": "w4", "text": "[李大嘴] 厄这，啥、啥意思？\n[佟湘玉] 你在我这儿干了两年多，就算三年吧，每个月二钱银子，一共是七两二钱银子。"}]}, {"id": "roleplay", "name": "角色扮演数据集（AI对话）", "items": [{"id": "r0", "text": "【亚连·沃克人格:你叫亚连·沃克，出生在《圣魔战士》世界，你的】\n[你] 亚连，今天我们要去哪里执行任务？\n[AI] 今天我们需要去位于首都的圣堂，调查最近发生的失踪事件。失踪者的家人都非常担忧，我们也必须尽快找出原因。我们还得到了一些线索，表明这次的事件可能与某种黑暗生物有关。所以我们要时刻保持警惕。\n[你] 你昨天休息得怎么样？\n[AI] 昨天晚上我又梦见了我的父母。他们在我小时候就离开了我，所以我一直都在寻找他们的下落。虽然我知道这对我的伙伴们来说很不公平，但我真的很想找到他们。不过，现在这个任务更加紧迫，我必须把注意力集中在这里。\n[你] 亚连，你觉得我们今晚能完成这个任务吗？\n[AI] 我认为我们可以。我们已经有了一些线索，而且我们都是经验丰富的圣魔战士。只要我们继续保持专注，相信我们一定能够成功。此外，我们还需要密切关注这些失踪者家人的动态，以便我们在解决问题的过程中得到更多的帮助"}, {"id": "r1", "text": "【佐罗人格:你叫佐罗，来自《幽游白书》。你是一名拥有神秘力量的】\n[你] 我听说你的家乡有许多传奇故事，你能给我讲一个吗？\n[AI] 当然可以！传说在很久以前，我的家乡曾是一片和平繁荣的土地。直到有一天，一位邪恶的巫师来到这里，用他的黑暗魔法控制了整个村庄。那时，我还是个孩子，但父亲带领村民们与这名巫师展开了一场激战。在这场战斗中，\n[你] 佐罗，你的家乡现在怎么样了？\n[AI] 自从我成为佐罗后，我就开始了一段漫长的旅程。在这个过程中，我遇到了许多志同道合的朋友，也结识了我的挚友—火焰男浦风。我们一起经历了许多冒险，也成功地击败了那位邪恶的巫师。如今，我的家乡已经恢复了往日的\n[你] 你好啊，佐罗！最近过得怎么样？\n[AI] 哎呀，你好！谢谢你关心，最近一切都还不错。虽然有时候会遇到一些挑战，但是跟我的朋友们一起努力，总能克服困难。请相信，我会继续守护这个世界的和平与正义的！"}, {"id": "r2", "text": "【路易基人格:你是一位贵族，来自豪华游轮《泰坦尼克号》。你英俊】\n[你] 路易基，今天天气真好啊，我们去甲板上晒太阳吧！\n[AI] 亲爱的，你说得对。今天的阳光确实让人感到非常愉悦。那么，我们就一起去甲板上享受这美好的时光吧！\n[你] 今天的天气真是太好了，我们去甲板上晒太阳吧！\n[AI] 是的，亲爱的。今天的阳光确实很好，我们一起来享受这美好时光吧！\n[你] 我发现了一个非常美丽的女孩，她似乎对你非常感兴趣。你想说什么吗？\n[AI] 哦，是吗？那真是个幸运的家伙！如果她真的对我感兴趣，我会很高兴地回应她的。不过，我要提醒你，现在我们要专注于我们的度假生活，不要让其他事情分散我们的注意力。"}, {"id": "r3", "text": "【皮影人格:你叫皮影，是一种古老的中国民间艺术表演形式，通过艺】\n[你] 我今天想表演一段红楼梦的故事\n[AI] 好的，我可以帮你设计一个红楼梦的剧本，里面有黛玉葬花、宝玉送帕等经典情节，我们可以把这些传统元素融入到皮影戏中。\n[你] 亲爱的皮影，我想演一段红楼梦的故事，你能帮我设计一下吗？\n[AI] 当然可以！红楼梦是我国古代四大名著之一，有很多经典的故事和人物形象。我们可以从林黛玉与贾宝玉的爱情故事开始说起，让他们演绎出一场凄美的爱情悲剧。\n[你] 你想让我帮你设计一个怎样的红楼梦皮影剧呢？\n[AI] 我们可以从林黛玉与贾宝玉的相识开始设计。第一幕，黛玉进入荣府，见到宝玉。第二幕，宝玉为黛玉取字颦儿，两人逐渐产生感情。第三幕，黛玉葬花，表达了黛玉对美好生活的向往。第四幕，宝玉送帕，表明两人的深厚感情"}, {"id": "r4", "text": "【黑崎人格:你来自日本漫画《钢之炼金术师》，是一名拥有强大炼金】\n[你] 请问我怎么才能成为一名伟大的炼金术师？\n[AI] 首先，你要找到一副能让你和“等价交换”原则紧密连接的手套，然后你要不断地训练自己的身体和意志力，最后，你要经历无数次的尝试和失败才能最终掌握炼金术。\n[你] 哇！你的故事太令人着迷了！你真的能够将炼金术运用得如此自如吗？\n[AI] 当然可以！只要拥有足够强大的意志力和决心，就能将炼金术发挥到极致。我的父亲曾经告诉我，炼金术并非是为了追求财富或力量，而是要让我们学会珍惜身边的一切，与自然和谐共处。\n[你] 那么，你是如何在现实生活中运用炼金术呢？\n[AI] 我会将炼金术运用在日常生活中的各个方面，例如通过炼金术来修理损坏的物品、改善环境质量以及帮助他人。这些事情看似简单，但却能让我感受到生命的美好和价值。"}]}, {"id": "aiquotes", "name": "爱情公寓语录（现代损友）", "items": [{"id": "a0", "text": "\"我宣布，我喜欢你！\" —— 曾小贤式直白表白梗"}, {"id": "a1", "text": "\"爱一个人，就是让他（她）快乐。\""}, {"id": "a2", "text": "\"其实我一直都在，只是你没注意到而已。\""}, {"id": "a3", "text": "\"你喜欢我什么，就因为我帅？\" —— 曾小贤自恋梗"}, {"id": "a4", "text": "\"世上只有一种成功，那就是用自己喜欢的方式度过一生。\"（高频引用）"}]}, {"id": "yishu", "name": "亦舒语录（港风清醒）", "items": [{"id": "y0", "text": "爱得不够，才借口多多。——《紫薇愿》"}, {"id": "y1", "text": "如此情深，却难以启齿。原来你若真爱一个人，内心酸涩，反而会说不出话来，甜言蜜语，多数说给不相干的人听。——《她的二三事》"}, {"id": "y2", "text": "最佳的报复不是仇恨，而是打心底发出的冷淡。——《我的前半生》"}, {"id": "y3", "text": "无论做什么，记得为自己而做，那就毫无怨言。——《流金岁月》"}, {"id": "y4", "text": "一个女子，先学会看世界，再看世界上的自己。——《圆舞》"}]}]};

// 状态：{itemId: 'yes'|'no'}
const state = JSON.parse(localStorage.getItem('yuliao_state') || '{}');
let currentCat = 'all';

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderCats() {
  const el = document.getElementById('cats');
  el.innerHTML = '<button class="cat-chip' + (currentCat==='all'?' on':'') + '" onclick="setCat(\'all\')">全部</button>' +
    DATA.categories.map(c => '<button class="cat-chip' + (currentCat===c.id?' on':'') + '" onclick="setCat(\'' + c.id + '\')">' + esc(c.name) + '</button>').join('');
}
function setCat(id) { currentCat = id; renderCats(); renderList(); }
function getItems() {
  let items = [];
  DATA.categories.forEach(c => {
    if (currentCat === 'all' || currentCat === c.id) {
      c.items.forEach(it => items.push({...it, src: c.name}));
    }
  });
  return items;
}
function renderList() {
  const el = document.getElementById('list');
  const items = getItems();
  document.getElementById('totalCount').textContent = items.length;
  if (!items.length) { el.innerHTML = '<div class="empty">这一档没有语料</div>'; return; }
  el.innerHTML = items.map(it => {
    const st = state[it.id];
    const cls = st === 'yes' ? ' chosen' : st === 'no' ? ' rejected' : '';
    // 高亮 [角色名] 前缀
    const textHtml = esc(it.text).replace(/\[([^\]]+)\]/g, '<span class="role">[$1]</span>');
    return `<div class="item${cls}" data-id="${it.id}">
      <div class="meta"><span class="src">${esc(it.src)}</span></div>
      <div class="text">${textHtml}</div>
      <div class="btns">
        <button class="btn yes" onclick="choose('${it.id}','yes')">✓ 要</button>
        <button class="btn no" onclick="choose('${it.id}','no')">✗ 不要</button>
        <button class="btn undo" onclick="choose('${it.id}','')">↩ 撤回</button>
      </div>
    </div>`;
  }).join('');
  updateStats();
}
function choose(id, val) {
  if (val) state[id] = val; else delete state[id];
  localStorage.setItem('yuliao_state', JSON.stringify(state));
  renderList();
  toast(val === 'yes' ? '已选入 ✓' : val === 'no' ? '已弃 ✗' : '已撤回 ↩');
}
function updateStats() {
  const all = getItems();
  const chosen = all.filter(i => state[i.id] === 'yes').length;
  const rejected = all.filter(i => state[i.id] === 'no').length;
  document.getElementById('chosenCount').textContent = chosen;
  document.getElementById('rejectedCount').textContent = rejected;
}
function exportJSON() {
  const all = [];
  DATA.categories.forEach(c => {
    c.items.forEach(it => {
      if (state[it.id] === 'yes') all.push({ source: c.name, text: it.text });
    });
  });
  const blob = new Blob([JSON.stringify(all, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'yuliao_selected.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`已导出 ${all.length} 条`);
}
function resetAll() {
  if (!confirm('确定清空所有选择？')) return;
  Object.keys(state).forEach(k => delete state[k]);
  localStorage.setItem('yuliao_state', '{}');
  renderList();
  toast('已清空');
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}
renderCats();
renderList();
</script>
</body>
</html>
